<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg-hero" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="bottle-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ecfdf5" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="amber-bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Rounded Card -->
  <rect width="800" height="600" rx="36" fill="url(#bg-hero)" />

  <!-- Decorative Organic Circles & Leaves -->
  <circle cx="680" cy="120" r="180" fill="url(#leaf-grad)" />
  <circle cx="140" cy="480" r="220" fill="url(#leaf-grad)" />
  <path d="M80 140 C160 60, 280 80, 300 200 C200 220, 120 180, 80 140 Z" fill="#6ee7b7" fill-opacity="0.18" />
  <path d="M720 460 C640 380, 520 400, 500 520 C600 540, 680 500, 720 460 Z" fill="#6ee7b7" fill-opacity="0.18" />

  <!-- Subtle Podium -->
  <ellipse cx="400" cy="495" rx="280" ry="38" fill="#022c22" fill-opacity="0.45" />
  <ellipse cx="400" cy="488" rx="250" ry="26" fill="#ecfdf5" fill-opacity="0.15" />

  <!-- Left Product: Collagen Jar -->
  <g filter="url(#shadow)" transform="translate(155, 220)">
    <rect x="20" y="0" width="120" height="32" rx="8" fill="#065f46" />
    <rect x="10" y="28" width="140" height="210" rx="24" fill="url(#bottle-glass)" />
    <rect x="22" y="65" width="116" height="135" rx="14" fill="#d1fae5" />
    <circle cx="80" cy="110" r="22" fill="#059669" fill-opacity="0.2" />
    <path d="M70 115 C75 95, 90 95, 92 115 C82 120, 75 120, 70 115 Z" fill="#059669" />
    <rect x="42" y="145" width="76" height="10" rx="5" fill="#065f46" />
    <rect x="52" y="163" width="56" height="7" rx="3.5" fill="#10b981" />
  </g>

  <!-- Center Product: Premium Moringa Bottle -->
  <g filter="url(#shadow)" transform="translate(310, 130)">
    <!-- Cap -->
    <rect x="45" y="0" width="90" height="36" rx="10" fill="#d97706" />
    <rect x="55" y="34" width="70" height="16" fill="#064e3b" />
    <!-- Bottle Body -->
    <rect x="15" y="46" width="150" height="310" rx="32" fill="#ffffff" />
    <!-- Label -->
    <rect x="27" y="100" width="126" height="205" rx="18" fill="#064e3b" />
    <!-- Botanical Emblem -->
    <circle cx="90" cy="165" r="34" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="2" />
    <path d="M90 140 C108 152, 108 178, 90 190 C72 178, 72 152, 90 140 Z" fill="#34d399" />
    <path d="M90 145 L90 185" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Label lines -->
    <rect x="48" y="216" width="84" height="12" rx="6" fill="#ffffff" />
    <rect x="60" y="236" width="60" height="8" rx="4" fill="#6ee7b7" />
    <rect x="52" y="262" width="76" height="20" rx="10" fill="#10b981" />
  </g>

  <!-- Right Product: Amber Dropper Tincture -->
  <g filter="url(#shadow)" transform="translate(495, 200)">
    <!-- Rubber bulb -->
    <rect x="52" y="0" width="36" height="42" rx="18" fill="#1f2937" />
    <!-- Gold collar -->
    <rect x="42" y="36" width="56" height="22" rx="5" fill="#fbbf24" />
    <!-- Amber body -->
    <path d="M42 58 L22 92 L22 260 C22 272 32 282 44 282 L96 282 C108 282 118 272 118 260 L118 92 L98 58 Z" fill="url(#amber-bottle)" />
    <!-- Label -->
    <rect x="32" y="115" width="76" height="130" rx="10" fill="#fef3c7" />
    <circle cx="70" cy="158" r="18" fill="#d97706" fill-opacity="0.2" />
    <path d="M70 145 C78 155, 78 165, 70 171 C62 165, 62 155, 70 145 Z" fill="#d97706" />
    <rect x="44" y="190" width="52" height="9" rx="4.5" fill="#78350f" />
    <rect x="50" y="206" width="40" height="6" rx="3" fill="#b45309" />
  </g>

  <!-- Floating Badges -->
  <g filter="url(#shadow)" transform="translate(65, 95)">
    <rect width="190" height="64" rx="20" fill="#ffffff" />
    <circle cx="36" cy="32" r="18" fill="#d1fae5" />
    <path d="M29 32 L34 37 L44 27" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="64" y="20" width="100" height="10" rx="5" fill="#064e3b" />
    <rect x="64" y="36" width="72" height="8" rx="4" fill="#10b981" />
  </g>

  <g filter="url(#shadow)" transform="translate(540, 80)">
    <rect width="200" height="64" rx="20" fill="#ffffff" />
    <circle cx="36" cy="32" r="18" fill="#fef3c7" />
    <path d="M36 21 L40 29 L48 30 L42 36 L43 44 L36 40 L29 44 L30 36 L24 30 L32 29 Z" fill="#d97706" />
    <rect x="64" y="20" width="110" height="10" rx="5" fill="#064e3b" />
    <rect x="64" y="36" width="84" height="8" rx="4" fill="#d97706" />
  </g>
</svg>
